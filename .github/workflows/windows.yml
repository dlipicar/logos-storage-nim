name: Windows (nix cross)

# Cross-compiled Windows artifacts are built via logos-windows-ci.
# We use a smoke test to verify the build output.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    uses: logos-co/logos-windows-ci/.github/workflows/windows-ci.yml@v1
    secrets: inherit
    with:
      targets: libstorage logos-storage-nim
      smoke-file: .github/smoke/storage-cross.sh
